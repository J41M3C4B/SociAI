[package]
name = "sociai"
version = "0.1.0"
description = "Herramienta local con IA para armar proyectos de donativos"
authors = []
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# The app and the crates of the ERP (ADR-002, D5): the kernel and each module are a crate, so a dependency the
# blueprint forbids does not compile. `cargo test` runs them all.
[workspace]
members = ["crates/kernel", "crates/modules/*", "crates/modules/*/contract", "crates/capability", "crates/platform", "crates/privacy"]
default-members = [".", "crates/kernel", "crates/modules/*", "crates/modules/*/contract", "crates/capability", "crates/platform", "crates/privacy"]

# the versions every crate shares, set once so SQLCipher and the rest are built once
[workspace.dependencies]
kernel = { path = "crates/kernel" }
rusqlite = { version = "0.40.2", features = ["bundled-sqlcipher-vendored-openssl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
linkme = "0.3.37"
tempfile = "3.27.0"
hex = "0.4.3"
sha2 = "0.11.0"
ulid = "3.0.0"
# the capability contract and the AI platform (ADR-003, A1 and A2)
capability = { path = "crates/capability" }
platform = { path = "crates/platform" }
# the local detector and the vault, for the app and the platform (ADR-004)
privacy = { path = "crates/privacy" }
regex = "1.13.1"
schemars = "1.2.2"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "sociai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
rusqlite = { workspace = true }
# the kernel of the ERP (ADR-002): the registry of modules, their migrations and the vocabulary of permissions
kernel = { workspace = true }
# the capability contract, under the kernel, and the runtime of the AI platform (ADR-003, A1 and A2)
capability = { workspace = true }
platform = { workspace = true }
privacy = { workspace = true }
getrandom = "0.4.3"
hex = { workspace = true }
keyring-core = "1.0.0"
calamine = "0.36.1"
umya-spreadsheet = "3.1.0"
zip = "8.6.0"
regex = { workspace = true }
sqlite-vec = "0.1.9"
# reads every PDF: its text, the letters and lines of its tables, and draws its scanned pages for Tesseract
# (ADR-035, ADR-037); pdfium.dll ships in resources/ocr
pdfium-render = { version = "0.9.4", default-features = false, features = ["pdfium_latest", "thread_safe"] }
# opens a photo or a drawn page to enlarge small letters before Tesseract reads it again (ADR-035): Tesseract does
# not enlarge; only the formats read here, no threads
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "pnm"] }
base64 = "0.22.1"
ulid = { workspace = true }
sha2 = { workspace = true }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "native-tls", "charset", "http2", "system-proxy"] }
async-trait = "0.1.92"
jsonschema = "0.58.3"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time"] }
argon2 = "0.6.0"
tauri-plugin-dialog = "2.8.2"
# the registry of capabilities (ADR-001): each one is gathered when the program is linked, with no list anywhere
linkme = { workspace = true }
# the JSON schema of a capability's input and output comes from its Rust type, never written by hand (ADR-001)
schemars = { workspace = true }
# the modules of the ERP the program has (ERP blueprint §4): Mi institución, the profile of the institution (ERP-1)
mi_institucion = { path = "crates/modules/mi_institucion" }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# a damaged PDF can make the reader panic: it must be caught (`catch_unwind`), not end the program
panic = "unwind"
strip = true

# development builds keep file and line for errors, not the full debug info: with it every test build
# left gigabytes behind in target/ (it reached 143 GB)
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[dev-dependencies]
tempfile = { workspace = true }
wiremock = "0.6.5"
# paused clock for tests that wait out a rate-limit window without really waiting
tokio = { version = "1.53.1", features = ["test-util"] }
roxmltree = "0.21.1"
# the sample module, the living reference of the shape of a module (ERP-8): linked only in the tests
muestra = { path = "crates/modules/muestra" }

[target."cfg(windows)".dependencies]
windows-native-keyring-store = "1.1.0"


